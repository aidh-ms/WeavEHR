# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3015016 = Tidal volume expired spontaneous+mechanical Respiratory system airway --on ventilator
#   21490789 = Tidal volume expired Respiratory system airway --on ventilator
# Expired tidal volume. 21490789 holds VTe in l (converted to mL) and
# Zephyros Vte in mL.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3015016(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^21490789//(VTe(\\(2\\))?)(//.*)?$"
    columns:
      numeric_value: col(numeric_value) * 1000
      text_value: col(text_value)
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^21490789//(Zephyros Vte)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

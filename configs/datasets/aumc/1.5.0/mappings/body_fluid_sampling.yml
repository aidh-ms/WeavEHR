# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- culture orders. ricu's aumc samp items are
# procedureorderitems, which AMSTEL writes to measurement (no value, dated at the
# order's registration) under these measurement_concept_ids:
#   4107893  = Blood culture                     (Bloedkweken afnemen)
#   4015189  = Microbial culture of sputum       (Sputumkweek afnemen, Research Sputumkweek
#                                                 COUrSe, SDD-kweken afnemen,
#                                                 SDD Inventarisatiekweken afnemen)
#   4024509  = Urine culture                     (Urinekweek afnemen)
#   1761466  = Staph aureus and MRSA screening   (MRSA kweken afnemen)
#   3040827  = Bacteria identified in Anal by Culture (Rectumkweek afnemen, Perineumkweek
#                                                 afnemen, the SDD orders)
#   3003714  = ... in Wound by Culture           (Wondkweek afnemen)
#   3009986  = ... in Catheter tip by Culture    (Cathetertipkweek afnemen)
#   3025037  = ... in Peritoneal fluid by Culture (Ascitesvochtkweek afnemen)
#   3008334  = ... in Drain by Aerobe culture    (Drainvochtkweek afnemen)
#   4024958  = Throat culture                    (Keelkweek afnemen, the SDD orders)
#   37392597 = Stool culture                     (Faeceskweek afnemen)
#   4196406  = Legionella rapid test             (Legionella sneltest (urine))
#   4189544  = Microbial culture                 (X-Kweek nader te bepalen)
#   4098503  = Cerebrospinal fluid culture       (Liquorkweek afnemen)
#   37117051 = Nasal culture for bacteria        (Neuskweek afnemen, Research Neuskweek COUrSe)
# No other AUMCdb source maps to these concepts. An order mapped to several concepts
# writes one row per concept at the same time. The procedure_occurrence rows AMSTEL
# also writes for some orders are not read.
#
# screening: orders taken by protocol rather than on suspicion of infection -- the SDD
# inventory cultures at the start of selective digestive decontamination and its
# twice-weekly surveillance cultures (SDD Inventarisatiekweken afnemen, SDD-kweken
# afnemen), MRSA screening (1761466, its only source) and the research cultures of the
# COUrSe study. They share their concepts with diagnostic cultures and are told apart by
# source value. diagnostic: every other order. ricu counts both as sampling;
# suspected_infection reads only the diagnostic ones.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: ^(3003714|3008334|3009986|3025037|3040827|4015189|4024509|4024958|4098503|4107893|4189544|4196406|37117051|37392597)//
    level: diagnostic
    columns: &order_columns
      numeric_value: const(1)
      text_value: col(text_value)
    filters:
      - not str_contains(code, "//(SDD|Research)[ -]")
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: ^(3040827|4015189|4024958|37117051)//
    level: screening
    columns: *order_columns
    filters:
      - str_contains(code, "//(SDD|Research)[ -]")
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: ^1761466//
    level: screening
    columns: *order_columns

# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3023081 = Carboxyhemoglobin/Hemoglobin.total in Blood
# CO-Hb (bloed) and FCOHb, stored in %.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3023081(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

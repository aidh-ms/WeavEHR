# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3020630 = Protein [Mass/volume] in Serum or Plasma
# Stored in g/l; converted to g/dL.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3020630(//.*)?$"
    columns:
      numeric_value: col(numeric_value) / 10
      text_value: col(text_value)

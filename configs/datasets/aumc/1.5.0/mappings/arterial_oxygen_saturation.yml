# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   42869608 = Oxygen saturation [Pure mass fraction] in Blood
# Only O2-Saturatie (bloed), as ricu's sao2; it is mostly stored as a 0-1
# fraction, which is converted to %. oxygen_saturation includes it as well.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^42869608//(O2-Saturatie \\(bloed\\))(//.*)?$"
    columns:
      numeric_value: replace(numeric_value <= 1.5, numeric_value * 100, numeric_value)
      text_value: col(text_value)

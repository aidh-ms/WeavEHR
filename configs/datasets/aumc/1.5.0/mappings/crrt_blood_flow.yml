# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   1988610 = Blood flow rate Renal replacement therapy circuit
# Stored in ml/min.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^1988610(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

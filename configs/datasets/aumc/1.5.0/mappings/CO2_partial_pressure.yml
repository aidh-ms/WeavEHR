# 3013290 = Carbon dioxide [Partial pressure] in Blood
# 3027946 = Carbon dioxide [Partial pressure] in Arterial blood
# Stored in mmHg, except for PCO2 (bloed) - kPa, which is converted to mmHg (1 kPa = 7.50062 mmHg).
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^(3013290|3027946)//[^/]*//mmHg$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^(3013290|3027946)//[^/]*//kPa$"
    columns:
      numeric_value: col(numeric_value) * 7.50062
      text_value: col(text_value)

# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   42527120 = Expired minute Volume during Mechanical ventilation
# Expired minute volume, stored in l/min.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^42527120(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

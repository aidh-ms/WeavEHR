# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3022875 = Positive end expiratory pressure setting Ventilator
#   42527140 = Total PEEP Respiratory system
# Set and total PEEP, as in MIMIC-IV; measured PEEP (21490855) is left out.
# Some items are stored in mbar, taken as equal to cmH2O (1 mbar = 1.02 cmH2O).
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^(3022875|42527140)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

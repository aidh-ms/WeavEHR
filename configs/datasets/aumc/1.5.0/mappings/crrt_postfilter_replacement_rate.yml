# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   1989384 = Post-filter replacement fluid rate Renal replacement therapy circuit
# Stored in ml/uur.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^1989384(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3012410 = Tidal volume setting Ventilator
# Teugvolume (Set) is stored in ml. Tidal Volume (Set) and (set)(2) are labelled ml
# but stored in l; they are converted to mL. Tidal Volume (Set) often shows exactly
# 2.0 l, mostly together with Insp. Flow max = 120 l/min (see ventilator_flow_rate).
# These look like device maxima rather than settings and are dropped.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3012410//(Teugvolume \\(Set\\))(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3012410//(Tidal Volume \\([Ss]et\\)(\\(2\\))?)(//.*)?$"
    columns:
      numeric_value: col(numeric_value) * 1000
      text_value: col(text_value)
    filters:
      - drop_if(col(numeric_value) == 2000)

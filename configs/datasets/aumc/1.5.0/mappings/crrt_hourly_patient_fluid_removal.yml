# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   1988683 = Continuous renal replacement therapy fluid removal goal [Volume] 1 hour
# Set net ultrafiltration rate, stored in ml/uur.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^1988683(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

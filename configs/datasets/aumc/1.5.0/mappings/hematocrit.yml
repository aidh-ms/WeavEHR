# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   42869588 = Hematocrit [Pure volume fraction] of Blood by Automated count
# AUMCdb mostly reports hematocrit as a decimal fraction (normal 0.35-0.5), converted to % (* 100) as ricu
# does. Some values of Ht(v.Bgs) (bloed) and Hematocriet are already in %, so only values up to 1 are converted.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^42869588(//.*)?$"
    columns:
      numeric_value: replace(numeric_value <= 1, numeric_value * 100, numeric_value)
      text_value: col(text_value)

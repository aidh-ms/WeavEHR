# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3020433 = Fluid output miscellaneous Measured
# Only CVVH Onttrokken; 3020433 also holds other fluid outputs. Stored in ml.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3020433//(CVVH Onttrokken)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

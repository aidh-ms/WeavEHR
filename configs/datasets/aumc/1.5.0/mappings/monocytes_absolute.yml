# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3001604 = Monocytes [#/volume] in Blood
# Stored in 10^9/l, which equals K/uL.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3001604(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

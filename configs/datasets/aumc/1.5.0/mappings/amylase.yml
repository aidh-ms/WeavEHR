# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3016771 = Amylase [Enzymatic activity/volume] in Serum or Plasma
# Serum or plasma only; stored in E/l (U/L).
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3016771(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

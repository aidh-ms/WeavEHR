# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   1989498 = Filter pressure Renal replacement therapy circuit
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^1989498(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

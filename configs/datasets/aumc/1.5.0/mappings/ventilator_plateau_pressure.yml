# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   44782825 = Airway plateau pressure
# Plateau druk, stored in mbar, taken as equal to cmH2O.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^44782825(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

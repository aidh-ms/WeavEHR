# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3026910 = Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
# Stored in E/l (U/L).
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3026910(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

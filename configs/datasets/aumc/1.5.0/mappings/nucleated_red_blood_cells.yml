# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   3034708 = Nucleated erythrocytes/100 leukocytes [Ratio] in Blood
# Erythroblasts per 100 leukocytes, i.e. %.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^3034708(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

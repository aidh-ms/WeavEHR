# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   1988543 = Pre-filter replacement fluid rate Renal replacement therapy circuit
# 1988543 also holds total substitution rates; only the predilution item is
# used here. Stored in ml/uur.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "^1988543//(MFT_Predilutieflow \\(ingesteld\\))(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

# ricu mech_vent process items; each interval ends at its recorded stop, with no gap filling.
# A tracheostomy counts as invasive support while in place, as for 1.5.0 and ricu.
type: simple
mappings:
  - pattern:
      table: processitems
      event: PROCESS_END
      code: ^(9328|12635)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
        record_id: col(record_id)
    level: invasive
  - pattern:
      table: processitems
      event: PROCESS_END
      code: ^(10740)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
        record_id: col(record_id)
    level: noninvasive

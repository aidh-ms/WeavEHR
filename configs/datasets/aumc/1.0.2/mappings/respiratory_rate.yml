# AUMCdb 1.0.2 native numericitems; same source selection/conversions as the 1.5.0 mapping.
# Item IDs and labels checked against the legacy dictionary and reprodICU/AMSTEL mappings.
#   7726: Ademfrequentie Spontaan [None]
#   8873: Ademfrequentie Evita [None]
#   8874: Ademfrequentie Monitor [None]
#   8876: Frequentie Spontaan [None]
#   9654: Ademfrequentie Spontaan(2) [None]
#   12266: Ademfreq. [/min]
#   12348: Ademfreq.(2) [/min]
#   12372: Rate (Bipap Vision) [/min]
#   12577: Ademfreq. Spontaan nieuw [/min]
#   16241: Zephyros Frequentie [/min]
type: simple
mappings:
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(7726|8873|8874|8876|9654|12266|12348|12372|12577|16241)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

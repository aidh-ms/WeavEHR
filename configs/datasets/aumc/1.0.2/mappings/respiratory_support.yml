# Native ventilator modes and oxygen devices, classified as in the 1.5.0 mappings.
# Multiple OMOP targets for one list answer are collapsed to one level: NIV, invasive, ventilator.
# These are spot observations; ventilation interval concepts use processitems instead.
type: simple
mappings:
  - pattern:
      table: listitems
      event: LIST
      code: ^(8189)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: noninvasive
    filters:
      - valueid == 16
  - pattern:
      table: listitems
      event: LIST
      code: ^(12290)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: noninvasive
    filters:
      - valueid == 16 or valueid == 17
  - pattern:
      table: listitems
      event: LIST
      code: ^(6685)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: invasive
    filters:
      - valueid == 6 or valueid == 9 or valueid == 20
  - pattern:
      table: listitems
      event: LIST
      code: ^(9534)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: invasive
    filters:
      - valueid == 2 or valueid == 5 or valueid == 6 or valueid == 10 or valueid == 11
  - pattern:
      table: listitems
      event: LIST
      code: ^(12290)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: invasive
    filters:
      - valueid == 4 or valueid == 5 or valueid == 6 or valueid == 7 or valueid == 12 or valueid == 15
  - pattern:
      table: listitems
      event: LIST
      code: ^(12347)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: invasive
    filters:
      - valueid == 6 or valueid == 7
  - pattern:
      table: listitems
      event: LIST
      code: ^(6685)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: ventilator
    filters:
      - valueid == 1 or valueid == 3 or valueid == 5 or valueid == 10 or valueid == 11 or valueid == 13 or valueid
        == 14 or valueid == 22
  - pattern:
      table: listitems
      event: LIST
      code: ^(9534)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: ventilator
    filters:
      - valueid == 1 or valueid == 3 or valueid == 4 or valueid == 7 or valueid == 8 or valueid == 9 or valueid
        == 12 or valueid == 13
  - pattern:
      table: listitems
      event: LIST
      code: ^(9652)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: ventilator
    filters:
      - valueid == 15
  - pattern:
      table: listitems
      event: LIST
      code: ^(12290)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: ventilator
    filters:
      - valueid == 2 or valueid == 3 or valueid == 8 or valueid == 9 or valueid == 10 or valueid == 11 or valueid
        == 13 or valueid == 14 or valueid == 18
  - pattern:
      table: listitems
      event: LIST
      code: ^(12347)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: ventilator
    filters:
      - valueid == 2 or valueid == 3 or valueid == 8
  - pattern:
      table: listitems
      event: LIST
      code: ^(12376)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: ventilator
    filters:
      - valueid == 1 or valueid == 2
  - pattern:
      table: listitems
      event: LIST
      code: ^(8189)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    level: oxygen
    filters:
      - valueid == 1 or valueid == 2 or valueid == 3 or valueid == 7 or valueid == 8 or valueid == 9 or valueid
        == 10 or valueid == 17

# AUMCdb 1.0.2 native numericitems; same source selection/conversions as the 1.5.0 mapping.
# Item IDs and labels checked against the legacy dictionary and reprodICU/AMSTEL mappings.
#   12275: Exp. tidal volume [ml]
#   12358: Exp. tidal volume (2) [ml]
#   8871: VTe [l]
#   9669: VTe(2) [l]
#   16243: Zephyros Vte [ml]
type: simple
mappings:
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(12275|12358)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(8871|9669)(//.*)?$
    columns:
      numeric_value: col(numeric_value) * 1000
      text_value: col(text_value)
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(16243)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

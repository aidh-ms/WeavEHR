# AUMCdb 1.0.2 native numericitems; same source selection/conversions as the 1.5.0 mapping.
# Item IDs and labels checked against the legacy dictionary and reprodICU/AMSTEL mappings.
#   6778: Hemoglobine [mmol/l]
#   9553: CtHB Astrup [mmol/l]
#   9960: Hb (bloed) [mmol/l]
#   10286: Hb(v.Bgs) (bloed) [mmol/l]
#   19703: Hb poct (bloed) [mmol/l]
type: simple
mappings:
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(6778|9553|9960|10286|19703)(//.*)?$
    columns:
      numeric_value: col(numeric_value) * 1.611344
      text_value: col(text_value)

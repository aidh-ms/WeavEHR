# Admission group representatives from ricu; original group is kept as text_value.
type: simple
mappings:
  - pattern:
      table: admissions
      event: WEIGHT
      code: ^WEIGHT$
    columns:
      numeric_value: replace(text_value == "59-", 50, replace(text_value == "60-69", 65, replace(text_value == "70-79",
        75, replace(text_value == "80-89", 85, replace(text_value == "90-99", 95, replace(text_value == "100-109",
        105, replace(text_value == "110+", 120, None)))))))
      text_value: col(text_value)
      extension:
        stay_id: col(admissionid)
    filters:
      - drop_na(numeric_value)

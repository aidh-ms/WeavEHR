# AUMCdb 1.0.2 native numericitems; same source selection/conversions as the 1.5.0 mapping.
# Item IDs and labels checked against the legacy dictionary and reprodICU/AMSTEL mappings.
#   8862: PEEP/CPAP [mbar]
#   12284: PEEP (Set) [cmH2O]
#   12301: PEEP tot [cmH2O]
#   12336: PEEP (Set) (2) [cmH2O]
#   12364: PEEP tot (2) [cmH2O]
#   16250: Zephyros PEEP [cmH2O]
# mbar is converted to cmH2O (1 mbar = 1.019716 cmH2O); 1.5.0 approximates them as equal.
type: simple
mappings:
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(8862|12284|12301|12336|12364|16250)(//.*)?$
    columns:
      numeric_value: replace(unit == "mbar", numeric_value * 1.019716, numeric_value)
      text_value: col(text_value)

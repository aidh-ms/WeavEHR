# An intubated verbal assessment is unassessable; the next valid verbal score clears the flag.
type: simple
mappings:
  - pattern:
      table: listitems
      event: LIST
      code: ^(6735|13066)(//.*)?$
    columns:
      numeric_value: replace(text_value == "Geïntubeerd", 1, replace((valueid >= 1) and (valueid <= 5), 0, None))
      text_value: col(text_value)
    filters:
      - drop_na(numeric_value)

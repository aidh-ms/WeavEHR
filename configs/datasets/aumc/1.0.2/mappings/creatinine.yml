# AUMCdb 1.0.2 native numericitems; same source selection/conversions as the 1.5.0 mapping.
# Item IDs and labels checked against the legacy dictionary and reprodICU/AMSTEL mappings.
#   6836: Kreatinine [µmol]
#   9941: Kreatinine (bloed) [µmol/l]
#   14216: KREAT enzym. (bloed) [µmol/l]
type: simple
mappings:
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(6836|9941|14216)(//.*)?$
    columns:
      numeric_value: col(numeric_value) * 0.011309
      text_value: col(text_value)

# AUMCdb 1.0.2 native numericitems; same source selection/conversions as the 1.5.0 mapping.
# Item IDs and labels checked against the legacy dictionary and reprodICU/AMSTEL mappings.
#   10413: MB-Massa (bloed) [µg/l]
type: simple
mappings:
  - pattern:
      table: numericitems
      event: NUMERIC
      code: ^(10413)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: noteevents
    event: NOTE
    code: ^Radiology(?:$|//)
  columns:
    text_value: col(text_value)
    extension:
      available_time: col(available_time)
      time_precision: col(time_precision)
      time_lower_bound: col(time_lower_bound)
      time_upper_bound: col(time_upper_bound)

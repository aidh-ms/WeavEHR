# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: inputevents_mv
    event: INFUSION_END
    code: ^(?:[A-Z_]+//)?(?:220950)(?:$|//)
  columns:
    numeric_value: col(rate)
    text_value: col(text_value)
  filters:
  - rateuom == "mL/hour"
  - drop_na(numeric_value)
- pattern:
    table: inputevents_mv
    event: INFUSION_END
    code: ^(?:[A-Z_]+//)?(?:228140)(?:$|//)
  columns:
    numeric_value: rate * 2
    text_value: col(text_value)
  filters:
  - rateuom == "mL/hour"
  - drop_na(numeric_value)
- pattern:
    table: inputevents_cv
    event: INFUSION_RATE
    code: ^(?:[A-Z_]+//)?(?:30016)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
  filters:
  - str_contains(rateuom, "^(?i:mlhr|mL/hour|mL/hr)$")
- pattern:
    table: inputevents_cv
    event: INFUSION_RATE
    code: ^(?:[A-Z_]+//)?(?:30017)(?:$|//)
  columns:
    numeric_value: col(numeric_value) * 2
    text_value: col(text_value)
  filters:
  - str_contains(rateuom, "^(?i:mlhr|mL/hour|mL/hr)$")

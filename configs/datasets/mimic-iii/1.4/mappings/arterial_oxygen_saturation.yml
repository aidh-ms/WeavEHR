# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:220227)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
  filters:
  - drop_na(numeric_value)
  - drop_if(col(numeric_value) < 0 or col(numeric_value) > 100)
- pattern:
    table: labevents
    event: LAB
    code: ^(?:[A-Z_]+//)?(?:50817)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
  filters:
  - drop_na(numeric_value)
  - drop_if(col(numeric_value) < 0 or col(numeric_value) > 100)
- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:834)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)

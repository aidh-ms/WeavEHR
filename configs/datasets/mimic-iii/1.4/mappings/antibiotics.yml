# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: prescriptions
    event: MEDICATION_ORDER
    code: (?i)(aztreonam|bactrim|cephalexin|chloramphenicol|cipro|flagyl|metronidazole|nitrofurantoin|tazobactam|rifampin|sulfadiazine|timentin|trimethoprim|(amika|gentami|vanco)cin|(amoxi|ampi|dicloxa|naf|oxa|peni|pipera)cillin|(azithro|clarithro|erythro|clinda|strepto|tobra|vanco)mycin|cef(azolin|tazidime|adroxil|epime|otetan|otaxime|podoxime|uroxime|triaxone)|(mero|imi|erta)penem|linezolid|daptomycin|(doxy|mino|tetra)cycline|(levofl|moxifl|ofl)oxacin|macro(bid|dantin)|(una|zo)syn)
  columns:
    numeric_value: const(1)
    text_value: col(text_value)
    extension:
      available_time: col(available_time)
      time_precision: col(time_precision)
      time_lower_bound: col(time_lower_bound)
      time_upper_bound: col(time_upper_bound)
  filters:
  - drop_na(time)
  - col(drug_type) != "BASE"
  - not str_contains(route, "^(OU|OS|OD|AU|AS|AD|TP)$|(?i:ear|eye)")
  - not str_contains(code, "(?i)cream|desensitization|ophth oint|gel")
- pattern:
    table: inputevents_mv
    event: INFUSION_START
    code: ^(?:[A-Z_]+//)?(?:225798|225837|225838|225840|225842|225843|225844|225845|225847|225848|225850|225851|225853|225855|225857|225859|225860|225862|225863|225865|225866|225868|225869|225871|225873|225875|225876|225877|225879|225881|225882|225883|225884|225885|225886|225888|225889|225890|225892|225893|225895|225896|225897|225898|225899|225900|225902|225903|225905|227691|228003)(?:$|//)
  columns:
    numeric_value: const(1)
    text_value: col(text_value)

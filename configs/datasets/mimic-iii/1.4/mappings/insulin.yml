# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: inputevents_mv
    event: INFUSION_END
    code: ^(?:[A-Z_]+//)?(?:223258)(?:$|//)
  columns:
    numeric_value: col(rate)
    text_value: col(text_value)
  filters:
  - rateuom == "units/hour"
  - drop_na(numeric_value)
- pattern:
    table: inputevents_cv
    event: INFUSION_RATE
    code: ^(?:[A-Z_]+//)?(?:30045|30100)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
  filters:
  - str_contains(rateuom, "^(?i:Uhr|units/hour|units/hr)$")

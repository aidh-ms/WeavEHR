# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: procedureevents_mv
    event: PROCEDURE_START
    code: ^(?:[A-Z_]+//)?(?:225792)(?:$|//)
  level: invasive
  columns:
    extension:
      stay_id: col(stay_id)
      orderid: col(orderid)
- pattern:
    table: procedureevents_mv
    event: PROCEDURE_START
    code: ^(?:[A-Z_]+//)?(?:225794)(?:$|//)
  level: noninvasive
  columns:
    extension:
      stay_id: col(stay_id)
      orderid: col(orderid)
- pattern:

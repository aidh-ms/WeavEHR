- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:467)(?:$|//)
  columns:
    text_value: col(text_value)
    extension:
      stay_id: col(stay_id)
  filters:
  - text_value == "Ventilator"

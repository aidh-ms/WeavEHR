    event: CHART
    code: ^(?:[A-Z_]+//)?(?:1|60|218|221|223|436|437|444|445|448|449|450|459|501|502|503|505|506|535|543|639|654|667|668|669|670|671|672|681|682|683|684|686|1211|1340|1486|1600|1655|2000|3459|5865|5866|220339|223848|223849|224419|224684|224685|224686|224687|224695|224696|224697|224700|224701|224702|224703|224704|224705|224706|224707|224709|224738|224746|224747|224750|226873|227187)(?:$|//)

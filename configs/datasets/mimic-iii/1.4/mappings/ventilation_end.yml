# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: procedureevents_mv
    event: PROCEDURE_END
    code: ^(?:[A-Z_]+//)?(?:225792)(?:$|//)
  level: invasive
  columns:
    extension:
      stay_id: col(stay_id)
      orderid: col(orderid)
- pattern:
    table: procedureevents_mv
    event: PROCEDURE_END
    code: ^(?:[A-Z_]+//)?(?:225794)(?:$|//)
  level: noninvasive
  columns:
    extension:
      stay_id: col(stay_id)
      orderid: col(orderid)
- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:467|469|226732)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:640)(?:$|//)
  columns:
    text_value: col(text_value)
    extension:
      stay_id: col(stay_id)
  filters:
  - str_contains(text_value, "^(Extubated|Self Extubation)$")
- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:467)(?:$|//)
  columns:
    text_value: col(text_value)
    extension:
      stay_id: col(stay_id)
  filters:
  - str_contains(text_value, "^(Cannula|Nasal Cannula|Face Tent|Aerosol-Cool|Trach Mask|Hi Flow Neb|Non-Rebreather|Venti Mask|Medium
    Conc Mask|Vapotherm|T-Piece|Hood|Hut|TranstrachealCat|Heated Neb|Ultrasonic Neb)$")

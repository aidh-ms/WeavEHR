# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: labevents
    event: LAB
    code: ^(?:[A-Z_]+//)?(?:50809|50931)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
- pattern:
    table: chartevents
    event: CHART
    code: ^(?:[A-Z_]+//)?(?:807|811|1529|3744|3745|220621|225664|226537)(?:$|//)
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)

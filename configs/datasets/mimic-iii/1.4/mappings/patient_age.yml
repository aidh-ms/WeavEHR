# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
type: simple
mappings:
- pattern:
    table: admissions
    event: PATIENT_AGE
    code: ^PATIENT_AGE$
  columns:
    numeric_value: replace(col(numeric_value) > 90, 90, cast(col(numeric_value), "int64"))
  filters:
  - drop_na(numeric_value)

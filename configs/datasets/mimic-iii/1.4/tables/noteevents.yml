path: NOTEEVENTS.csv.gz
columns:
- name: ROW_ID
  type: int64
- name: SUBJECT_ID
  type: int64
- name: HADM_ID
  type: int64
- name: CHARTDATE
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: CHARTTIME
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: STORETIME
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: CATEGORY
  type: string
- name: DESCRIPTION
  type: string
- name: CGID
  type: int64
- name: ISERROR
  type: string
- name: TEXT
  type: string
event_defaults:
  subject_id: col(SUBJECT_ID)
  extension:
    hadm_id: col(HADM_ID)
    caregiver_id: col(CGID)
    row_id: col(ROW_ID)
filters:
- not (ISERROR == "1") or ISERROR == None
callbacks:
- add_offset(CHARTDATE, 1, offset_unit="days", output=chartdate_plus1)
events:
- name: NOTE
  columns:
    time: first_not_null(CHARTTIME, chartdate_plus1, output=time)
    code:
    - col(CATEGORY)
    - col(DESCRIPTION)
    text_value: col(TEXT)
    extension:
      available_time: col(STORETIME)
      time_precision: replace(CHARTTIME == None, const(day), const(second))
      time_lower_bound: first_not_null(CHARTTIME, CHARTDATE)
      time_upper_bound: first_not_null(CHARTTIME, chartdate_plus1)
  filters:
  - drop_na(time)

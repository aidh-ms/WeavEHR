# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: NOTEEVENTS.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: chartdate
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: category
  type: string
- name: description
  type: string
- name: cgid
  type: int64
- name: iserror
  type: string
- name: text
  type: string
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    caregiver_id: col(cgid)
    row_id: col(row_id)
filters:
- not (iserror == "1") or iserror == None
events:
- name: NOTE
  columns:
    time: first_not_null(charttime, chartdate, output=time)
    code:
    - col(category)
    - col(description)
    text_value: col(text)
    extension:
      available_time: first_not_null(storetime, charttime, chartdate, output=available_time)
  filters:
  - drop_na(time)

path: NOTEEVENTS.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: chartdate
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: category
  type: string
- name: description
  type: string
- name: cgid
  type: int64
- name: iserror
  type: string
- name: text
  type: string
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    caregiver_id: col(cgid)
    row_id: col(row_id)
filters:
- not (iserror == "1") or iserror == None
callbacks:
- add_offset(chartdate, 1, offset_unit="days", output=chartdate_plus1)
events:
- name: NOTE
  columns:
    time: first_not_null(charttime, chartdate_plus1, output=time)
    code:
    - col(category)
    - col(description)
    text_value: col(text)
    extension:
      available_time: col(storetime)
      time_precision: replace(charttime == None, const(day), const(second))
      time_lower_bound: first_not_null(charttime, chartdate)
      time_upper_bound: first_not_null(charttime, chartdate_plus1)
  filters:
  - drop_na(time)

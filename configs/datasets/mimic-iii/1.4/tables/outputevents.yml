path: OUTPUTEVENTS.csv.gz
columns:
- name: ROW_ID
  type: int64
- name: SUBJECT_ID
  type: int64
- name: HADM_ID
  type: int64
- name: ICUSTAY_ID
  type: int64
- name: CHARTTIME
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: ITEMID
  type: int64
- name: VALUE
  type: float32
- name: VALUEUOM
  type: string
- name: STORETIME
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: CGID
  type: int64
- name: STOPPED
  type: string
- name: NEWBOTTLE
  type: string
- name: ISERROR
  type: int64
join:
- path: D_ITEMS.csv.gz
  columns:
  - name: ITEMID
    type: int64
  - name: LABEL
    type: string
  both_on:
  - ITEMID
event_defaults:
  subject_id: col(SUBJECT_ID)
  extension:
    hadm_id: col(HADM_ID)
    stay_id: col(ICUSTAY_ID)
    caregiver_id: col(CGID)
    row_id: col(ROW_ID)
filters:
- not (ISERROR == 1) or ISERROR == None
events:
- name: FLUID_OUTPUT
  columns:
    time: col(CHARTTIME)
    code:
    - col(ITEMID)
    - col(LABEL)
    - col(VALUEUOM)
    numeric_value: col(VALUE)
    extension:
      available_time: col(STORETIME)
  filters:
  - drop_na(time)

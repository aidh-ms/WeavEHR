path: PRESCRIPTIONS.csv.gz
columns:
- name: ROW_ID
  type: int64
- name: SUBJECT_ID
  type: int64
- name: HADM_ID
  type: int64
- name: ICUSTAY_ID
  type: int64
- name: STARTDATE
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: ENDDATE
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: DRUG_TYPE
  type: string
- name: DRUG
  type: string
- name: DRUG_NAME_POE
  type: string
- name: DRUG_NAME_GENERIC
  type: string
- name: FORMULARY_DRUG_CD
  type: string
- name: GSN
  type: string
- name: NDC
  type: string
- name: PROD_STRENGTH
  type: string
- name: DOSE_VAL_RX
  type: string
- name: DOSE_UNIT_RX
  type: string
- name: FORM_VAL_DISP
  type: string
- name: FORM_UNIT_DISP
  type: string
- name: ROUTE
  type: string
event_defaults:
  subject_id: col(SUBJECT_ID)
  extension:
    hadm_id: col(HADM_ID)
    stay_id: col(ICUSTAY_ID)
    row_id: col(ROW_ID)
events:
- name: MEDICATION_ORDER
  columns:
    time: add_offset(STARTDATE, 1, offset_unit="days")
    code:
    - col(DRUG)
    text_value: col(PROD_STRENGTH)
    extension:
      # III records prescription validity dates, not the order-entry time.
      available_time: cast(None, "datetime")
      time_precision: const(day)
      time_lower_bound: col(STARTDATE)
      time_upper_bound: add_offset(STARTDATE, 1, offset_unit="days")
      prescribed_start: col(STARTDATE)
      prescribed_end: col(ENDDATE)
      drug_type: col(DRUG_TYPE)
      ndc: col(NDC)
      dose: col(DOSE_VAL_RX)
      dose_uom: col(DOSE_UNIT_RX)
      route: col(ROUTE)
  filters:
  - drop_na(time)

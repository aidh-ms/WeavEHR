# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: SERVICES.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: transfertime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: prev_service
  type: string
- name: curr_service
  type: string
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    row_id: col(row_id)
events:
- name: SERVICE
  columns:
    time: col(transfertime)
    code:
    - col(curr_service)
    extension:
      available_time: col(transfertime)
      prev_service: col(prev_service)
  filters:
  - drop_na(time)

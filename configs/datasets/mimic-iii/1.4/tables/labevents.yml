path: LABEVENTS.csv.gz
columns:
- name: ROW_ID
  type: int64
- name: SUBJECT_ID
  type: int64
- name: HADM_ID
  type: int64
- name: ITEMID
  type: int64
- name: CHARTTIME
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: VALUE
  type: string
- name: VALUENUM
  type: float32
- name: VALUEUOM
  type: string
- name: FLAG
  type: string
join:
- path: D_LABITEMS.csv.gz
  columns:
  - name: ITEMID
    type: int64
  - name: LABEL
    type: string
  both_on:
  - ITEMID
event_defaults:
  subject_id: col(SUBJECT_ID)
  extension:
    hadm_id: col(HADM_ID)
    row_id: col(ROW_ID)
events:
- name: LAB
  columns:
    time: col(CHARTTIME)
    code:
    - col(ITEMID)
    - col(LABEL)
    - col(VALUEUOM)
    numeric_value: col(VALUENUM)
    text_value: col(VALUE)
    extension:
      available_time: col(CHARTTIME)
      flag: col(FLAG)
  filters:
  - drop_na(time)

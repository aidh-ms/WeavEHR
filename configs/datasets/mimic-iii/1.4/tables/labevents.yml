# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: LABEVENTS.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: itemid
  type: int64
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: value
  type: string
- name: valuenum
  type: float32
- name: valueuom
  type: string
- name: flag
  type: string
join:
- path: D_LABITEMS.csv.gz
  csv_header_case: lower
  columns:
  - name: itemid
    type: int64
  - name: label
    type: string
  both_on:
  - itemid
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    row_id: col(row_id)
events:
- name: LAB
  columns:
    time: col(charttime)
    code:
    - col(itemid)
    - col(label)
    - col(valueuom)
    numeric_value: col(valuenum)
    text_value: col(value)
    extension:
      available_time: col(charttime)
      flag: col(flag)
  filters:
  - drop_na(time)

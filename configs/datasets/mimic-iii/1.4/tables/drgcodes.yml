path: DRGCODES.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: drg_type
  type: string
- name: drg_code
  type: string
- name: description
  type: string
- name: drg_severity
  type: int64
- name: drg_mortality
  type: int64
join:
- path: ADMISSIONS.csv.gz
  csv_header_case: lower
  columns:
  - name: hadm_id
    type: int64
  - name: dischtime
    type: datetime
    params:
      format: '%Y-%m-%d %H:%M:%S'
      strict: false
  both_on:
  - hadm_id
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    row_id: col(row_id)
events:
- name: DRG
  columns:
    time: col(dischtime)
    code:
    - col(drg_type)
    - col(drg_code)
    text_value: col(description)
    extension:
      available_time: col(dischtime)
      drg_severity: col(drg_severity)
      drg_mortality: col(drg_mortality)
  filters:
  - drop_na(time)

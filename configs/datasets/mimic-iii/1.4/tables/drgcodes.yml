path: DRGCODES.csv.gz
columns:
- name: ROW_ID
  type: int64
- name: SUBJECT_ID
  type: int64
- name: HADM_ID
  type: int64
- name: DRG_TYPE
  type: string
- name: DRG_CODE
  type: string
- name: DESCRIPTION
  type: string
- name: DRG_SEVERITY
  type: int64
- name: DRG_MORTALITY
  type: int64
join:
- path: ADMISSIONS.csv.gz
  columns:
  - name: HADM_ID
    type: int64
  - name: DISCHTIME
    type: datetime
    params:
      format: '%Y-%m-%d %H:%M:%S'
      strict: false
  both_on:
  - HADM_ID
event_defaults:
  subject_id: col(SUBJECT_ID)
  extension:
    hadm_id: col(HADM_ID)
    row_id: col(ROW_ID)
events:
- name: DRG
  columns:
    time: col(DISCHTIME)
    code:
    - col(DRG_TYPE)
    - col(DRG_CODE)
    text_value: col(DESCRIPTION)
    extension:
      available_time: col(DISCHTIME)
      drg_severity: col(DRG_SEVERITY)
      drg_mortality: col(DRG_MORTALITY)
  filters:
  - drop_na(time)

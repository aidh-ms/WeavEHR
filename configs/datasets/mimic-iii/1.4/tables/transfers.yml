# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: TRANSFERS.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: dbsource
  type: string
- name: eventtype
  type: string
- name: prev_careunit
  type: string
- name: curr_careunit
  type: string
- name: prev_wardid
  type: int64
- name: curr_wardid
  type: int64
- name: intime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: outtime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: los
  type: float32
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    stay_id: col(icustay_id)
    row_id: col(row_id)
events:
- name: TRANSFER_IN
  columns:
    time: col(intime)
    code:
    - col(eventtype)
    - col(curr_careunit)
    extension:
      available_time: col(intime)
  filters:
  - drop_na(time)
- name: TRANSFER_OUT
  columns:
    time: col(outtime)
    code:
    - col(eventtype)
    - col(prev_careunit)
    extension:
      available_time: col(outtime)
  filters:
  - drop_na(time)

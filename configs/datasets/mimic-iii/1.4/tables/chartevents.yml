# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: CHARTEVENTS.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: itemid
  type: int64
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: cgid
  type: int64
- name: value
  type: string
- name: valuenum
  type: float32
- name: valueuom
  type: string
- name: warning
  type: int64
- name: error
  type: int64
- name: resultstatus
  type: string
- name: stopped
  type: string
join:
- path: D_ITEMS.csv.gz
  csv_header_case: lower
  columns:
  - name: itemid
    type: int64
  - name: label
    type: string
  both_on:
  - itemid
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    stay_id: col(icustay_id)
    caregiver_id: col(cgid)
    row_id: col(row_id)
filters:
- not (error == 1) or error == None
events:
- name: CHART
  columns:
    time: col(charttime)
    code:
    - col(itemid)
    - col(label)
    - col(valueuom)
    numeric_value: col(valuenum)
    text_value: col(value)
    extension:
      available_time: col(storetime)
      error: col(error)
      warning: col(warning)
  filters:
  - drop_na(time)

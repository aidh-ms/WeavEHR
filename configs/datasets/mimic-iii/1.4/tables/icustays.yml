# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: ICUSTAYS.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: dbsource
  type: string
- name: first_careunit
  type: string
- name: last_careunit
  type: string
- name: first_wardid
  type: int64
- name: last_wardid
  type: int64
- name: intime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: outtime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: los
  type: float32
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    stay_id: col(icustay_id)
    row_id: col(row_id)
events:
- name: icu_admission
  columns:
    time: col(intime)
    code:
    - const("ICU_ADMISSION")
    extension:
      available_time: col(intime)
      dbsource: col(dbsource)
  filters:
  - drop_na(time)
- name: icu_discharge
  columns:
    time: col(outtime)
    code:
    - const("ICU_DISCHARGE")
    extension:
      available_time: col(outtime)
  filters:
  - drop_na(time)
- name: icu_length_of_stay
  columns:
    time: col(outtime)
    code:
    - const("days")
    numeric_value: col(los)
    extension:
      available_time: col(outtime)
  filters:
  - drop_na(time)

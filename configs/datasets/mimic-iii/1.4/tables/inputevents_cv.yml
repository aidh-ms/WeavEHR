path: INPUTEVENTS_CV.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: itemid
  type: int64
- name: amount
  type: float32
- name: amountuom
  type: string
- name: rate
  type: float32
- name: rateuom
  type: string
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: cgid
  type: int64
- name: orderid
  type: int64
- name: linkorderid
  type: int64
- name: stopped
  type: string
- name: newbottle
  type: int64
- name: originalamount
  type: float32
- name: originalamountuom
  type: string
- name: originalroute
  type: string
- name: originalrate
  type: float32
- name: originalrateuom
  type: string
- name: originalsite
  type: string
join:
- path: D_ITEMS.csv.gz
  csv_header_case: lower
  columns:
  - name: itemid
    type: int64
  - name: label
    type: string
  both_on:
  - itemid
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    stay_id: col(icustay_id)
    caregiver_id: col(cgid)
    row_id: col(row_id)
events:
- name: INFUSION_RATE
  columns:
    time: col(charttime)
    code:
    - col(itemid)
    - col(label)
    numeric_value: col(rate)
    text_value: col(stopped)
    extension:
      available_time: col(storetime)
      rateuom: col(rateuom)
      amount: col(amount)
      amountuom: col(amountuom)
      orderid: col(orderid)
      linkorderid: col(linkorderid)
  filters:
  - drop_na(time)

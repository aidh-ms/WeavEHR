# MIMIC-III v1.4; sources and validation: configs/datasets/mimic-iii/README.md
path: PROCEDUREEVENTS_MV.csv.gz
csv_header_case: lower
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: starttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: endtime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: itemid
  type: int64
- name: value
  type: float32
- name: valueuom
  type: string
- name: location
  type: string
- name: locationcategory
  type: string
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: cgid
  type: int64
- name: orderid
  type: int64
- name: linkorderid
  type: int64
- name: ordercategoryname
  type: string
- name: secondaryordercategoryname
  type: string
- name: ordercategorydescription
  type: string
- name: isopenbag
  type: int64
- name: continueinnextdept
  type: int64
- name: cancelreason
  type: int64
- name: statusdescription
  type: string
- name: comments_editedby
  type: string
- name: comments_canceledby
  type: string
- name: comments_date
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
join:
- path: D_ITEMS.csv.gz
  csv_header_case: lower
  columns:
  - name: itemid
    type: int64
  - name: label
    type: string
  both_on:
  - itemid
event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    stay_id: col(icustay_id)
    caregiver_id: col(cgid)
    row_id: col(row_id)
    orderid: col(orderid)
    linkorderid: col(linkorderid)
filters:
- not (statusdescription == "Rewritten") or statusdescription == None
events:
- name: PROCEDURE_START
  columns:
    time: col(starttime)
    code:
    - col(itemid)
    - col(label)
    extension:
      available_time: max(storetime, starttime, output=available_time)
      location: col(location)
      locationcategory: col(locationcategory)
      ordercategoryname: col(ordercategoryname)
      ordercategorydescription: col(ordercategorydescription)
      isopenbag: col(isopenbag)
      cancelreason: col(cancelreason)
  filters:
  - drop_na(time)
- name: PROCEDURE_END
  columns:
    time: col(endtime)
    code:
    - col(itemid)
    - col(label)
    text_value: col(statusdescription)
    extension:
      available_time: max(storetime, endtime, output=available_time)
      value: col(value)
      valueuom: col(valueuom)
      continueinnextdept: col(continueinnextdept)
      cancelreason: col(cancelreason)
  filters:
  - drop_na(time)

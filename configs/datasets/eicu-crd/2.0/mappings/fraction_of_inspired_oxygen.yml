# Contains fractions such as 0.4 and percentage strings such as "60%".
# Convert numeric fractions in [0.2, 1] to percent.
# Recover percentage text when the numeric value is absent; retain source text
# and numeric values outside the conversion interval without range filtering.
# ricu 0.6.3 reads the charted text with percent_as_numeric (as.numeric() after removing
# "%"), does not convert fractions such as 0.4 (its 21-100 % limits then drop them) and
# sets lab FiO2 to missing where the unit matches mm(hg).
# Implementation difference; not reported upstream.
type: simple
mappings:
  - pattern:
      table: respiratorycharting
      event: RESPIRATORY_CHART
      code: (FiO2(//.*)?)
    columns: &fio2_columns
      numeric_value: >-
        replace(
          numeric_value == None,
          cast(strip_str(text_value, " %"), "float32"),
          replace(
            (numeric_value >= 0.2) & (numeric_value <= 1),
            numeric_value * 100,
            numeric_value
          )
        )
      text_value: col(text_value)
  - pattern:
      table: lab
      event: LAB
      code: ^(FiO2)(//.*)?$
    columns: *fio2_columns
    # L/min describes oxygen flow, not inspired oxygen concentration.
    # Retain rows with missing unit information.
    filters:
      - replace(labmeasurenameinterface == None, True, not str_contains(labmeasurenameinterface, "(?i)^\\s*l\\s*/\\s*min\\s*$"))

# vitalperiodic: monitor values. nursecharting: nurse-charted values; rows at the same
# time as a monitor value are kept.
# YAIB's ricu-extensions add the nurse-charted rates for eICU-CRD but not for the eICU
# demo, while their temperature and blood pressure add the extra rows for both
# The demo has the same tables, so eicu-demo inherits this mapping in full.
# Not reported upstream; whether the YAIB difference is intended is unknown.
type: simple
mappings:
- pattern:
    table: vitalperiodic
    event: RESPIRATORY_RATE
    code: ^VITALS_PERIODIC//bpm$
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)
- pattern:
    table: nursecharting
    event: NURSE_CHART
    code: ^Vital Signs//Respiratory Rate//Respiratory Rate$
  columns:
    numeric_value: col(numeric_value)
    text_value: col(text_value)

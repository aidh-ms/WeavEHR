# ricu 0.6.3 applies the same limits when loading the concept (its sbp concept: 0-300 mmHg,
# inclusive). YAIB's weavehr-extensions had no range filter here.
type: simple
mappings:
- pattern:
    table: vitalperiodic
    event: SYSTOLIC_BLOOD_PRESSURE
    code: ^VITALS_PERIODIC//mmHg$
  columns: &columns
    numeric_value: col(numeric_value)
    text_value: col(text_value)
  filters: &filters
    - drop_if(col(numeric_value) < 0 or col(numeric_value) > 300)
- pattern:
    table: vitalaperiodic
    event: NON_INVASIVE_SYSTOLIC_BLOOD_PRESSURE
    code: ^VITALS_APERIODIC$
  columns: *columns
  filters: *filters

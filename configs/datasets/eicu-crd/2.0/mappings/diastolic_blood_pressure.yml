# ricu 0.6.3 applies the same limits when loading the concept (its dbp concept: 0-200 mmHg,
# inclusive). YAIB's weavehr-extensions had no range filter here.
type: simple
mappings:
- pattern:
    table: vitalperiodic
    event: DIASTOLIC_BLOOD_PRESSURE
    code: ^VITALS_PERIODIC//mmHg$
  columns: &columns
    numeric_value: col(numeric_value)
    text_value: col(text_value)
- pattern:
    table: vitalaperiodic
    event: NON_INVASIVE_DIASTOLIC_BLOOD_PRESSURE
    code: ^VITALS_APERIODIC$
  columns: *columns

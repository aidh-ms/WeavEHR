type: simple
mappings:
- pattern:
    table: vitalperiodic
    event: DIASTOLIC_BLOOD_PRESSURE
    code: ^VITALS_PERIODIC//mmHg$
  columns: &columns
    numeric_value: col(numeric_value)
    text_value: col(text_value)
  filters: &filters
    - drop_if(col(numeric_value) < 0 or col(numeric_value) > 200)
- pattern:
    table: vitalaperiodic
    event: NON_INVASIVE_DIASTOLIC_BLOOD_PRESSURE
    code: ^VITALS_APERIODIC$
  columns: *columns
  filters: *filters

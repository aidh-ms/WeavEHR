type: simple
mappings:
  # Invasive/non-invasive ventilation procedure markers, paired by native orderid.
  # Event presence marks the start; no numeric measurement is required.
  - pattern:
      table: procedureevents
      event: PROCEDURE_START
      code: ^(?:PROCEDURE_START//)?(?:225792)(?:$|//)
    level: invasive
    columns:
      extension:
        stay_id: col(stay_id)
        orderid: col(orderid)
  - pattern:
      table: procedureevents
      event: PROCEDURE_START
      code: ^(?:PROCEDURE_START//)?(?:225794)(?:$|//)
    level: noninvasive
    columns:
      extension:
        stay_id: col(stay_id)
        orderid: col(orderid)

# Changed/ChangeDose/Rate closes a segment, not an infusion. Unknown endings are not stops.
type: simple
mappings:
- pattern:
    table: inputevents
    event: INFUSION_START
    code: ^221653(?:$|//)
  columns:
    numeric_value: normalize_rate(originalrate, rateuom, "mcg/kg/min", weight_kg=patientweight)
    text_value: col(text_value)
    extension:
      stay_id: col(stay_id)
      linkorderid: col(linkorderid)
      infusion_id: concat_str("inputevents:", linkorderid)
      segment_id: cast(orderid, "str")
      available_time: col(available_time)
      source_unit: col(rateuom)
      source_value: col(originalrate)
      normalisation_weight_kg: replace(rateuom.str.contains("(?i)kg"), None, patientweight)
      event_kind: const("RATE_UPDATE")
      rate_basis: const("documented_setting")
  filters:
  - drop_na(numeric_value)
- pattern:
    table: inputevents
    event: INFUSION_END
    code: ^221653(?:$|//)
  columns:
    numeric_value: const(0)
    text_value: col(text_value)
    extension:
      stay_id: col(stay_id)
      linkorderid: col(linkorderid)
      infusion_id: concat_str("inputevents:", linkorderid)
      segment_id: cast(orderid, "str")
      available_time: col(available_time)
      source_unit: col(rateuom)
      source_value: col(rate)
      normalisation_weight_kg: const(None)
      event_kind: const("STOP")
      rate_basis: const("documented_stop")
  filters:
  - text_value == "Stopped" or text_value == "Paused" or text_value == "FinishedRunning"
  - continueinnextdept == None or cast(continueinnextdept, "int64") != 1

type: simple
mappings:
  # Infection pairing uses the prescribed treatment start (ricu's abx input),
  # while the extracted MEDICATION_ORDER itself retains its order timestamp.
  # Extend ricu's prescription names with ceftriaxone, meropenem and linezolid
  # (also in mimic-code at 303d26c), plus ertapenem, imipenem and daptomycin.
  - pattern:
      table: prescriptions
      event: MEDICATION_ORDER
      code: (?i)(aztreonam|bactrim|cephalexin|chloramphenicol|cipro|flagyl|metronidazole|nitrofurantoin|tazobactam|rifampin|sulfadiazine|timentin|trimethoprim|(amika|gentami|vanco)cin|(amoxi|ampi|dicloxa|naf|oxa|peni|pipera)cillin|(azithro|clarithro|erythro|clinda|strepto|tobra|vanco)mycin|cef(azolin|tazidime|adroxil|epime|otetan|otaxime|podoxime|uroxime|triaxone)|(mero|imi|erta)penem|linezolid|daptomycin|(doxy|mino|tetra)cycline|(levofl|moxifl|ofl)oxacin|macro(bid|dantin)|(una|zo)syn)
    columns:
      time: parse_date_time(prescribed_start, format="%Y-%m-%d %H:%M:%S%.f")
      numeric_value: const(1)
      text_value: col(text_value)
    filters:
      - drop_na(time)
  - pattern:
      table: inputevents
      event: INFUSION_START
      code: (225798(//.*)?|225837(//.*)?|225838(//.*)?|225840(//.*)?|225842(//.*)?|225843(//.*)?|225844(//.*)?|225845(//.*)?|225847(//.*)?|225848(//.*)?|225850(//.*)?|225851(//.*)?|225853(//.*)?|225855(//.*)?|225857(//.*)?|225859(//.*)?|225860(//.*)?|225862(//.*)?|225863(//.*)?|225865(//.*)?|225866(//.*)?|225868(//.*)?|225869(//.*)?|225871(//.*)?|225873(//.*)?|225875(//.*)?|225876(//.*)?|225877(//.*)?|225879(//.*)?|225881(//.*)?|225882(//.*)?|225883(//.*)?|225884(//.*)?|225885(//.*)?|225886(//.*)?|225888(//.*)?|225889(//.*)?|225890(//.*)?|225892(//.*)?|225893(//.*)?|225895(//.*)?|225896(//.*)?|225897(//.*)?|225898(//.*)?|225899(//.*)?|225900(//.*)?|225902(//.*)?|225903(//.*)?|225905(//.*)?|227691(//.*)?|228003(//.*)?)
    columns:
      # An infusion ending is not another antibiotic administration.
      numeric_value: const(1)
      text_value: col(text_value)

type: simple
mappings:
  - pattern:
      table: chartevents
      event: CHART
      code: ^(?:CHART//)?(?:223835)(?:$|//)
    columns:
      numeric_value: replace((col(numeric_value) >= 0.2) & (col(numeric_value) <= 1), col(numeric_value) * 100, col(numeric_value))
      text_value: col(text_value)
  - pattern:
      table: labevents
      event: LAB
      code: ^(?:LAB//)?(?:50816)(?:$|//)
    columns:
      numeric_value: replace((col(numeric_value) >= 0.2) & (col(numeric_value) <= 1), col(numeric_value) * 100, col(numeric_value))
      text_value: col(text_value)

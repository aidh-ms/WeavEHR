# ricu 0.6.3 (urine) also maps 227510 "TF Residual" (d_items category "Output"); per
# https://github.com/MIT-LCP/mimic-code/issues/753 it is gastric residual aspirated before
# tube feeding, not urine. mimic-code's mimic-iv/concepts/measurement/urine_output.sql
# does not use it (its older MIMIC-III cookbook uo.sql did). mimic-iv-ricu reproduces
# ricu. Independently identified; not reported to ricu.
type: simple
mappings:
  - pattern:
      table: outputevents
      event: FLUID_OUTPUT
      code: ^(?:FLUID_OUTPUT//)?(?:226557|226558|226559|226560|226561|226563|226564|226565|226566|226567|226584)(?:$|//)
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

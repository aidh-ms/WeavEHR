# Peripheral SpO2 (220277). ricu 0.6.3 (o2sat) also maps 226253 "SpO2 Desat Limit"
# (d_items category "Alarms"). Reported upstream in
# https://github.com/eth-mds/ricu/issues/16 ("abnormal flag for lower limit rather than
# an actual measured value"), closed in 2023 without changing o2sat. ricu's o2sat also
# pools 220227 and lab 50817, which WeavEHR maps to arterial_oxygen_saturation.
type: simple
mappings:
  - pattern:
      table: chartevents
      event: CHART
      code: ^(?:CHART//)?(?:220277)(?:$|//)
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
    filters:
      - drop_na(numeric_value)
      - drop_if(col(numeric_value) < 0 or col(numeric_value) > 100)

path: icu/icustays.csv.gz

columns:
  # subject_id and extentions
  - name: hadm_id
    type: int64
  - name: stay_id
    type: int64
  - name: subject_id
    type: int64
  # db fields - times
  - name: intime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  - name: outtime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  # db fields - values
  - name: first_careunit
    type: string
  - name: last_careunit
    type: string
  - name: los
    type: float32

event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)
    stay_id: col(stay_id)
    # The first and last care unit describe the whole ICU stay, so every event of
    # the stay carries both as extension columns; the event codes stay unchanged.
    first_careunit: col(first_careunit)
    last_careunit: col(last_careunit)

events:
  - name: icu_admission
    columns:
      code:
        - const("ICU_ADMISSION")
      time: col(intime)
      extension:
        available_time: col(intime)
  - name: icu_discharge
    columns:
      code:
        - const("ICU_DISCHARGE")
      time: col(outtime)
      extension:
        available_time: col(outtime)
    filters:
      - drop_na(time)
  - name: icu_length_of_stay
    columns:
      time: col(outtime)
      code:
        - const(days)
      numeric_value: col(los)
      extension:
        available_time: col(outtime)
    filters:
      - drop_na(time)
      - drop_na(numeric_value)

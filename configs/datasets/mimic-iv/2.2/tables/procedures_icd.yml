path: hosp/procedures_icd.csv.gz

columns:
  # subject_id and extentions
  - name: subject_id
    type: int64
  - name: hadm_id
    type: int64
  # db fields - times
  - name: chartdate
    type: datetime
    params:
      format: "%Y-%m-%d"
  # db fields - values
  - name: seq_num
    type: int64
  - name: icd_code
    type: string
  - name: icd_version
    type: int64

# chartdate has no time of day. The procedure has happened by the end of that
# day, and placing it at midnight would put it before same-day events that
# preceded it. Same convention as hcpcsevents and the date of death (patients).
post_join_callbacks:
  - set_time(chartdate, 23, 59, 59, output=chartdate_24)

join:
  - name: d_icd_procedures
    path: hosp/d_icd_procedures.csv.gz
    columns:
      # subject_id and extentions
      # db fields - times
      # db fields - values
      - name: icd_code
        type: string
      - name: icd_version
        type: int64
      - name: long_title
        type: string
    both_on:
      - icd_code
      - icd_version
  - name: admissions
    path: hosp/admissions.csv.gz
    columns:
      # subject_id and extentions
      - name: hadm_id
        type: int64
      # db fields - times
      - name: dischtime
        type: datetime
        params:
          format: "%Y-%m-%d %H:%M:%S"
      # db fields - values
    both_on:
      - hadm_id

event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)

events:
  - name: PROCEDURE
    columns:
      time: col(chartdate_24)
      code:
        - const("ICD")
        - col(icd_version)
        - col(icd_code)
        - col(long_title)
      extension:
        # ICD procedure codes are billing codes of the admission, so they are
        # treated as available at discharge. For a procedure charted on the
        # discharge day this is earlier than its end-of-day time.
        available_time: col(dischtime)
        seq_num: col(seq_num)

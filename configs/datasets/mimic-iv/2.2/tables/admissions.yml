path: hosp/admissions.csv.gz

columns:
  # subject_id and extentions
  - name: subject_id
    type: int64
  - name: hadm_id
    type: int64
  - name: admit_provider_id
    type: string
  # db fields - times
  - name: admittime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  - name: dischtime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  - name: deathtime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  - name: edregtime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  - name: edouttime
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
  # db fields - values
  - name: admission_type
    type: string
  - name: admission_location
    type: string
  - name: discharge_location
    type: string
  - name: insurance
    type: string
  - name: language
    type: string
  - name: marital_status
    type: string
  - name: race
    type: string
  - name: hospital_expire_flag
    type: int64

join:
  - path: hosp/patients.csv.gz
    columns:
      - name: subject_id
        type: int64
      - name: anchor_age
        type: int64
      - name: anchor_year
        type: int64
    both_on:
      - subject_id

post_join_callbacks:
  - cast(admittime, "string", output=admit_text)
  - slice_str(admit_text, 0, 4, output=admit_year_text)
  - cast(admit_year_text, "int64", output=admit_year)

event_defaults:
  subject_id: col(subject_id)
  time: col(admittime)
  extension:
    available_time: col(admittime)
    hadm_id: col(hadm_id)
    admit_provider_id: col(admit_provider_id)

events:
  - name: ED_REGISTRATION
    columns:
      code:
        - const("ED_REGISTRATION")
      time: col(edregtime)
      extension:
        available_time: col(edregtime)
    filters:
      - drop_na(time)
  - name: ED_OUT
    columns:
      code:
        - const("ED_OUT")
      time: col(edouttime)
      extension:
        available_time: col(edouttime)
    filters:
      - drop_na(time)


  - name: HOSPITAL_ADMISSION
    columns:
      code:
        - col(admission_type)
        - col(admission_location)

  # Age at this admission, as in mimic-code: anchor_age plus the calendar years
  # since anchor_year. Anchor ages above 89 are recorded as 91.
  - name: PATIENT_AGE
    columns:
      code:
        - const("PATIENT_AGE")
      numeric_value: anchor_age + admit_year - anchor_year

  - name: ADMISSION_TYPE
    columns:
      code:
        - col(admission_type)

  - name: INSURANCE
    columns:
      code:
        - col(insurance)
    filters:
      - drop_na(insurance)

  - name: LANGUAGE
    columns:
      code:
        - col(language)
    filters:
      - drop_na(language)

  - name: MARITAL_STATUS
    columns:
      code:
        - col(marital_status)
    filters:
      - drop_na(marital_status)

  - name: ETHNICITY
    columns:
      code:
        - col(race)

  - name: HOSPITAL_DISCHARGE
    columns:
      time: col(dischtime)
      code:
        - col(discharge_location)
      extension:
        available_time: col(dischtime)

  - name: IN_HOSPITAL_MORTALITY
    columns:
      time: col(dischtime)
      code:
        - const("IN_HOSPITAL_MORTALITY")
      numeric_value: col(hospital_expire_flag)
      extension:
        available_time: col(dischtime)
    filters:
      - drop_na(time)
      - drop_na(numeric_value)


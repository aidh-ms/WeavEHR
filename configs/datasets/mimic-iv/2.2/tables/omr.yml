path: hosp/omr.csv.gz

columns:
  # subject_id and extentions
  - name: subject_id
    type: int64
  # db fields - times
  - name: chartdate
    type: datetime
    params:
      format: "%Y-%m-%d"
  # db fields - values
  - name: seq_num
    type: int64
  - name: result_name
    type: string
  - name: result_value
    type: string

event_defaults:
  subject_id: col(subject_id)

events:
  - name: OMR
    columns:
      # chartdate has no time of day, so the record is dated at the start of its
      # date (00:00).
      time: col(chartdate)
      code:
        - col(result_name)
      text_value: col(result_value)
      extension:
        # The record carries only its date, so it is available when it happened.
        available_time: col(chartdate)
        seq_num: col(seq_num)

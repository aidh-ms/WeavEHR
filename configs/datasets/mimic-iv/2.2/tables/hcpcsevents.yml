path: hosp/hcpcsevents.csv.gz

columns:
  - name: subject_id
    type: int64
  - name: hadm_id
    type: int64
  - name: chartdate
    type: datetime
    params:
      format: "%Y-%m-%d"
  - name: hcpcs_cd
    type: string
  - name: seq_num
    type: int64
  - name: short_description
    type: string
post_join_callbacks:
  - set_time(chartdate, 23, 59, 59, output=chartdate_24)
join:
  - name: d_hcpcs
    path: hosp/d_hcpcs.csv.gz
    columns:
      - name: code
        type: string
      - name: category
        type: int64
      - name: long_description
        type: string
    left_on:
      - hcpcs_cd
    right_on:
      - code
  - name: admissions
    path: hosp/admissions.csv.gz
    columns:
      - name: hadm_id
        type: int64
      - name: dischtime
        type: datetime
        params:
          format: "%Y-%m-%d %H:%M:%S"
    both_on:
      - hadm_id

event_defaults:
  subject_id: col(subject_id)
  extension:
    hadm_id: col(hadm_id)

events:
  - name: HCPCS
    columns:
      time: col(chartdate_24)
      code:
        - col(hcpcs_cd)
        - col(long_description)
      extension:
        available_time: col(dischtime)
        seq_num: col(seq_num)

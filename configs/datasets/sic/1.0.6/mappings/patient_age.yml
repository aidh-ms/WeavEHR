# SICdb v1.0.6 -- cases AGE event [ricu age]
# Age in whole years at ICU admission; 90 stands for 90 or older.
type: simple
mappings:
  - pattern:
      table: cases
      event: AGE
      code: "^(age)(//.*)?$"
    columns:
      numeric_value: replace(col(numeric_value) > 90, 90, col(numeric_value))
    filters:
      - drop_na(numeric_value)

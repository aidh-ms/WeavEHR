# SICdb v1.0.6 -- cases SEX event [ricu sex]
# Female, Male or Other; no event when sex is unknown.
type: simple
mappings:
  - pattern:
      table: cases
      event: SEX
      code: "^(sex)(//.*)?$"
    columns:
      text_value: col(text_value)
    filters:
      - (text_value == "Female") or (text_value == "Male") or (text_value == "Other")

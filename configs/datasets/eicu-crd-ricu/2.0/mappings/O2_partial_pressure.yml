# Apply ricu 0.6.3 concept limits before aggregation.
type: simple
mappings:
  - pattern:
      table: lab
      event: LAB
      code: ^(paO2)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
    filters:
      - drop_if(col(numeric_value) < 40 or col(numeric_value) > 600)

# Apply ricu 0.6.3 concept limits before aggregation.
type: simple
mappings:
  - pattern:
      table: intakeoutput
      event: INTAKE_OUTPUT
      code: '(?:\|Urine$|\|URINE CATHETER$|\|(?i:[^|]*catheter[^|]+output[^|]*|[^|]*output[^|]+catheter[^|]*)$)'
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
    filters:
      - drop_if(col(numeric_value) < 0 or col(numeric_value) > 2000)

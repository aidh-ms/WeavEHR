# Apply ricu 0.6.3 concept limits before aggregation.
# Approximates ricu 0.6.3, which reads the charted text with percent_as_numeric
# (as.numeric() after removing "%"). This mapping takes the extracted number, else the
# first of the leading 4, 3, 2 and 1 characters of the text that is a number. Both agree on
# all 27,432 charted FiO2 rows of the eICU demo but differ for text after the number
# (e.g. "40% NRB": ricu missing, here 40). Fractions such as 0.4 stay unconverted (ricu's
# 21-100 % limits drop them); eicu-crd converts them. Lab FiO2 is mapped unchanged,
# whereas ricu sets rows whose unit matches mm(hg) to missing (none in the eICU demo).
type: simple
mappings:
  - pattern:
      table: respiratorycharting
      event: RESPIRATORY_CHART
      code: (FiO2(//.*)?)
    columns:
      numeric_value: >-
        replace(numeric_value > -1, numeric_value,
          replace(cast(slice_str(text_value, 0, 4), "float64") > -1, cast(slice_str(text_value, 0, 4), "float64"),
            replace(cast(slice_str(text_value, 0, 3), "float64") > -1, cast(slice_str(text_value, 0, 3), "float64"),
              replace(cast(slice_str(text_value, 0, 2), "float64") > -1, cast(slice_str(text_value, 0, 2), "float64"),
                cast(slice_str(text_value, 0, 1), "float64")))))
      text_value: col(text_value)
    filters:
      - drop_if(col(numeric_value) < 21 or col(numeric_value) > 100)
  - pattern:
      table: lab
      event: LAB
      code: ^(FiO2)(//.*)?$
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
    filters:
      - drop_if(col(numeric_value) < 21 or col(numeric_value) > 100)

# As ricu 0.6.3 for eICU: calcium whose reported unit is mmol/L is multiplied by 4. The
# factor from the molar mass is 4.008 (Ca 40.078 g/mol), which eicu-crd uses and ricu uses
# for HiRID and AUMC; 4 gives values 0.2 % lower. Approximation; not reported upstream.
type: simple
mappings:
  - pattern:
      table: lab
      event: LAB
      code: ^calcium//.*$
    columns:
      numeric_value: >-
        replace(
          str_contains(labmeasurenameinterface, "(?i)^mmol/l$"),
          numeric_value * 4,
          numeric_value
        )
      text_value: col(text_value)

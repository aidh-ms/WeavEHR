type: simple
mappings:
  - pattern:
      table: chartevents
      event: CHART
      code: ^(?:CHART//)?(?:320277)(?:$|//)
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

  - pattern:
      table: labevents
      event: LAB
      code: ^(?:LAB//)?(?:100109)(?:$|//)
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

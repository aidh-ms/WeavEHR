# HiRID v1.1.1: Hourly urine volume (variableid 10020000).
# Source unit: mL/h, as documented in the variable reference.
# The range 0-2000 mL/h follows the YAIB/ricu urine_rate concept.
type: simple
mappings:
  - pattern:
      table: observations
      event: OBSERVATION
      code: "^(10020000)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
    filters:
      - drop_na(numeric_value)
      - drop_if(col(numeric_value) < 0 or col(numeric_value) > 2000)

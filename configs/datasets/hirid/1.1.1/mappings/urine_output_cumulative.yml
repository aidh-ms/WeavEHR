# HiRID v1.1.1 -- observations variableid(s) 30005110 [ricu urine, before its hirid_urine]
# The charted running total, unchanged; urine_output.yml takes its increases, as ricu.
# Unverified: the HiRID-ICU-Benchmark variable reference (varref.tsv) names it "OUT/c"
# ("Fluid balance", unit "cummulative"), not urine; ricu uses it as urine output.
type: simple
mappings:
  - pattern:
      table: observations
      event: OBSERVATION
      code: "^(30005110)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

# HiRID v1.1.1 -- observations variableid(s) 24000480 [ricu lymph, before its blood_cell_ratio]
# The HiRID-ICU-Benchmark variable reference (varref.tsv) describes it as "Lymphocytes
# [#/volume] in Blood" without a unit (normal value 2.3). G/l (= K/uL, the concept unit)
# is inferred from that and from ricu dividing it by the white cell count (20000700).
type: simple
mappings:
  - pattern:
      table: observations
      event: OBSERVATION
      code: "^(24000480)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)

# HiRID v1.1.1 (PhysioNet) -- raw pharma_records (medication administrations).
#
# Distributed as many partitioned parquet parts; the glob path reads them all.
# Keyed on `pharmaid`; the drug name is joined in from hirid_variable_reference.csv
# (the same reference table also covers pharma variables) and appended to the
# code -> hirid//pharma//<pharmaid>//<Variable Name>//<doseunit>.
#
# Each record is one administration fact, kept as it is. A record's `givendose` is the dose
# given since the previous record of its infusion: on HiRID 1.1.1 it equals the rise of
# `cumulativedose` in over 99% of records, start records carry no dose, and stop records the
# dose of the last interval.
path: raw_stage/pharma_records/parquet/*.parquet

columns:
  # subject_id and extensions
  - name: patientid
    type: int64
  - name: infusionid
    type: int64
  - name: typeid
    type: int64
  - name: recordstatus
    type: int64
  # db fields - times
  - name: givenat
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
      strict: false
  - name: enteredentryat
    type: datetime
    params:
      format: "%Y-%m-%d %H:%M:%S"
      strict: false
  # db fields - values
  - name: pharmaid
    type: int64
  - name: givendose
    type: float32
  - name: doseunit
    type: str

join:
  - name: hirid_variable_reference
    path: reference_data/hirid_variable_reference.csv
    columns:
      - name: Source Table
        type: str
      - name: ID
        type: int64
      - name: Variable Name
        type: str
    filters:
      - col("Source Table") == "Pharma"
    left_on:
      - pharmaid
    right_on:
      - ID

event_defaults:
  subject_id: col(patientid)
  time: col(givenat)
  extension:
    available_time: col(enteredentryat)
    infusion_id: col(infusionid)
    # HiRID has one ICU stay per patient.
    stay_id: col(patientid)
    doseunit: col(doseunit)
    # `recordstatus` is a bit field: 2 invalidated, 4 infusion start, 8 record, 32 not
    # administered, 256 infusion stop, 512 report. A record without a status has no flags.
    given: (recordstatus & 34) == 0
    infusion_start: (recordstatus & 4) != 0
    infusion_stop: (recordstatus & 256) != 0

events:
  - name: PHARMA
    columns:
      code:
        - col(pharmaid)
        - col("Variable Name")
        - col(doseunit)
      numeric_value: col(givendose)
    filters:
      - drop_na(time)

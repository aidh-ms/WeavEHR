path: ICUSTAYS.csv
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: dbsource
  type: string
- name: first_careunit
  type: string
- name: last_careunit
  type: string
- name: first_wardid
  type: int64
- name: last_wardid
  type: int64
- name: intime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: outtime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: los
  type: float32
callbacks:
- col(row_id, output=ROW_ID)
- col(subject_id, output=SUBJECT_ID)
- col(hadm_id, output=HADM_ID)
- col(icustay_id, output=ICUSTAY_ID)
- col(dbsource, output=DBSOURCE)
- col(first_careunit, output=FIRST_CAREUNIT)
- col(last_careunit, output=LAST_CAREUNIT)
- col(first_wardid, output=FIRST_WARDID)
- col(last_wardid, output=LAST_WARDID)
- col(intime, output=INTIME)
- col(outtime, output=OUTTIME)
- col(los, output=LOS)

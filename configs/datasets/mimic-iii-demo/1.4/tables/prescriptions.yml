path: PRESCRIPTIONS.csv
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: startdate
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: enddate
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: drug_type
  type: string
- name: drug
  type: string
- name: drug_name_poe
  type: string
- name: drug_name_generic
  type: string
- name: formulary_drug_cd
  type: string
- name: gsn
  type: string
- name: ndc
  type: string
- name: prod_strength
  type: string
- name: dose_val_rx
  type: string
- name: dose_unit_rx
  type: string
- name: form_val_disp
  type: string
- name: form_unit_disp
  type: string
- name: route
  type: string
callbacks:
- col(row_id, output=ROW_ID)
- col(subject_id, output=SUBJECT_ID)
- col(hadm_id, output=HADM_ID)
- col(icustay_id, output=ICUSTAY_ID)
- col(startdate, output=STARTDATE)
- col(enddate, output=ENDDATE)
- col(drug_type, output=DRUG_TYPE)
- col(drug, output=DRUG)
- col(drug_name_poe, output=DRUG_NAME_POE)
- col(drug_name_generic, output=DRUG_NAME_GENERIC)
- col(formulary_drug_cd, output=FORMULARY_DRUG_CD)
- col(gsn, output=GSN)
- col(ndc, output=NDC)
- col(prod_strength, output=PROD_STRENGTH)
- col(dose_val_rx, output=DOSE_VAL_RX)
- col(dose_unit_rx, output=DOSE_UNIT_RX)
- col(form_val_disp, output=FORM_VAL_DISP)
- col(form_unit_disp, output=FORM_UNIT_DISP)
- col(route, output=ROUTE)

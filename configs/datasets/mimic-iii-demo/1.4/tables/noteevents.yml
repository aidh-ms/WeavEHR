path: NOTEEVENTS.csv
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: chartdate
  type: datetime
  params:
    format: '%Y-%m-%d'
    exact: false
    strict: false
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: category
  type: string
- name: description
  type: string
- name: cgid
  type: int64
- name: iserror
  type: string
- name: text
  type: string
callbacks:
- col(row_id, output=ROW_ID)
- col(subject_id, output=SUBJECT_ID)
- col(hadm_id, output=HADM_ID)
- col(chartdate, output=CHARTDATE)
- col(charttime, output=CHARTTIME)
- col(storetime, output=STORETIME)
- col(category, output=CATEGORY)
- col(description, output=DESCRIPTION)
- col(cgid, output=CGID)
- col(iserror, output=ISERROR)
- col(text, output=TEXT)
- add_offset(CHARTDATE, 1, offset_unit="days", output=chartdate_plus1)

path: LABEVENTS.csv
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: itemid
  type: int64
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: value
  type: string
- name: valuenum
  type: float32
- name: valueuom
  type: string
- name: flag
  type: string
callbacks:
- col(row_id, output=ROW_ID)
- col(subject_id, output=SUBJECT_ID)
- col(hadm_id, output=HADM_ID)
- col(itemid, output=ITEMID)
- col(charttime, output=CHARTTIME)
- col(value, output=VALUE)
- col(valuenum, output=VALUENUM)
- col(valueuom, output=VALUEUOM)
- col(flag, output=FLAG)
join:
- path: D_LABITEMS.csv
  columns:
  - name: itemid
    type: int64
  - name: label
    type: string
  callbacks:
  - col(itemid, output=ITEMID)
  - col(label, output=LABEL)
  both_on:
  - ITEMID

path: TRANSFERS.csv
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: dbsource
  type: string
- name: eventtype
  type: string
- name: prev_careunit
  type: string
- name: curr_careunit
  type: string
- name: prev_wardid
  type: int64
- name: curr_wardid
  type: int64
- name: intime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: outtime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: los
  type: float32
callbacks:
- col(row_id, output=ROW_ID)
- col(subject_id, output=SUBJECT_ID)
- col(hadm_id, output=HADM_ID)
- col(icustay_id, output=ICUSTAY_ID)
- col(dbsource, output=DBSOURCE)
- col(eventtype, output=EVENTTYPE)
- col(prev_careunit, output=PREV_CAREUNIT)
- col(curr_careunit, output=CURR_CAREUNIT)
- col(prev_wardid, output=PREV_WARDID)
- col(curr_wardid, output=CURR_WARDID)
- col(intime, output=INTIME)
- col(outtime, output=OUTTIME)
- col(los, output=LOS)

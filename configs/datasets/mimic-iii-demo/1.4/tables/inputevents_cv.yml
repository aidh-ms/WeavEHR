path: INPUTEVENTS_CV.csv
columns:
- name: row_id
  type: int64
- name: subject_id
  type: int64
- name: hadm_id
  type: int64
- name: icustay_id
  type: int64
- name: charttime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: itemid
  type: int64
- name: amount
  type: float32
- name: amountuom
  type: string
- name: rate
  type: float32
- name: rateuom
  type: string
- name: storetime
  type: datetime
  params:
    format: '%Y-%m-%d %H:%M:%S'
    strict: false
- name: cgid
  type: int64
- name: orderid
  type: int64
- name: linkorderid
  type: int64
- name: stopped
  type: string
- name: newbottle
  type: int64
- name: originalamount
  type: float32
- name: originalamountuom
  type: string
- name: originalroute
  type: string
- name: originalrate
  type: float32
- name: originalrateuom
  type: string
- name: originalsite
  type: string
callbacks:
- col(row_id, output=ROW_ID)
- col(subject_id, output=SUBJECT_ID)
- col(hadm_id, output=HADM_ID)
- col(icustay_id, output=ICUSTAY_ID)
- col(charttime, output=CHARTTIME)
- col(itemid, output=ITEMID)
- col(amount, output=AMOUNT)
- col(amountuom, output=AMOUNTUOM)
- col(rate, output=RATE)
- col(rateuom, output=RATEUOM)
- col(storetime, output=STORETIME)
- col(cgid, output=CGID)
- col(orderid, output=ORDERID)
- col(linkorderid, output=LINKORDERID)
- col(stopped, output=STOPPED)
- col(newbottle, output=NEWBOTTLE)
- col(originalamount, output=ORIGINALAMOUNT)
- col(originalamountuom, output=ORIGINALAMOUNTUOM)
- col(originalroute, output=ORIGINALROUTE)
- col(originalrate, output=ORIGINALRATE)
- col(originalrateuom, output=ORIGINALRATEUOM)
- col(originalsite, output=ORIGINALSITE)
join:
- path: D_ITEMS.csv
  columns:
  - name: itemid
    type: int64
  - name: label
    type: string
  callbacks:
  - col(itemid, output=ITEMID)
  - col(label, output=LABEL)
  both_on:
  - ITEMID
- path: CHARTEVENTS.csv
  columns:
  - name: subject_id
    type: int64
  - name: icustay_id
    type: int64
  - name: charttime
    type: datetime
    params:
      format: '%Y-%m-%d %H:%M:%S'
      strict: false
  - name: storetime
    type: datetime
    params:
      format: '%Y-%m-%d %H:%M:%S'
      strict: false
  - name: itemid
    type: int64
  - name: valuenum
    type: float32
  - name: error
    type: int64
  callbacks:
  - col(subject_id, output=SUBJECT_ID)
  - col(icustay_id, output=ICUSTAY_ID)
  - col(charttime, output=CHARTTIME)
  - col(storetime, output=STORETIME)
  - col(itemid, output=ITEMID)
  - col(valuenum, output=VALUENUM)
  - col(error, output=ERROR)
  - col(CHARTTIME, output=weight_time)
  - col(STORETIME, output=weight_available_time)
  - col(VALUENUM, output=weight_kg)
  filters:
  - ITEMID == 762 or ITEMID == 763 or ITEMID == 224639
  - ERROR == None or ERROR != 1
  - weight_kg > 0
  - first_distinct(SUBJECT_ID, ICUSTAY_ID, weight_time, order_by=[weight_available_time])
  suffix: _weight
  asof: true
  how: left
  left_on:
  - CHARTTIME
  right_on:
  - weight_time
  by:
  - SUBJECT_ID
  - ICUSTAY_ID
